[workspace]
members = ["crates/aegis-core", "crates/aegis-proxy", "crates/aegis-bench"]
exclude = ["plugins/zero-fee-filter"]
resolver = "2"

[workspace.dependencies]
solana-sdk = "2"
ahash = "0.8"
base64 = "0.22"
bincode = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
arc-swap = "1"
bs58 = "0.5"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.12", features = ["json"] }
prometheus = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
config = "0.14"
criterion = { version = "0.5", features = ["html_reports"] }
alloy-consensus = { version = "~2.1", features = ["secp256k1"] }
alloy-eips = "~2.1"
alloy-primitives = "1"
alloy-signer = "~2.1"
alloy-signer-local = "~2.1"
hex = "0.4"
proptest = "1"
