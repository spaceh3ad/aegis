# Aegis in front of an external Solana RPC (testnet / devnet / mainnet, e.g. Helius).
#
# Self-contained: no local validator, no emulation. Use this to demo Aegis against
# real chain data.
#
#   # public testnet (no key needed):
#   docker compose -f docker-compose.rpc.yml up --build
#
#   # Helius testnet (put your key in the URL):
#   AEGIS_RPC_URL="https://testnet.helius-rpc.com/?api-key=$HELIUS_API_KEY" \
#     docker compose -f docker-compose.rpc.yml up --build
#
# Aegis listens on http://localhost:8899; Prometheus on :9090; Grafana on :3001.
services:
  aegis:
    build: .
    environment:
      LISTEN_ADDR: "0.0.0.0:8899"
      # Any JSON-RPC endpoint works: Helius, Triton, a public cluster, or your own node.
      DOWNSTREAM_URL: "${AEGIS_RPC_URL:-https://api.testnet.solana.com}"
      BLOCKLIST_PATH: "/app/blocklist.txt"
      # Optional: operator threat feeds and a Wasm rule, same as the local stack.
      # THREAT_FEEDS: "seal=https://example.org/seal.txt"
      # WASM_PLUGIN_PATH: "/app/zero-fee-filter.wasm"
    ports:
      - "8899:8899"
    volumes:
      - ./blocklist.txt:/app/blocklist.txt:ro
    healthcheck:
      # bash is present in the runtime image; /dev/tcp avoids needing curl.
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/8899; printf 'GET /metrics HTTP/1.0\\r\\n\\r\\n' >&3; grep -q aegis_blocklist_size <&3"
      interval: 5s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.4.2
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=1h"
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - aegis

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "3001:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
