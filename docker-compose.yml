# Aegis in Docker, chains on the host.
#
# Aegis fronts ONE upstream, so there is one instance per chain — the same image twice:
#   aegis-sol  :8899 -> host anvil/validator? no: -> host solana-test-validator :8900
#   aegis-evm  :8898 -> host anvil :8545
#
# Run the chains yourself on the host:
#   solana-test-validator --reset --quiet --rpc-port 8900
#   anvil --port 8545 --chain-id 31337
#
# Aegis reaches them through host.docker.internal. Both instances share the policy files
# under demo/.run/ (mounted at /app/policy): edit them on the host and signal the
# containers to reload — no restart.
#
#   docker compose up --build -d
#   docker compose logs -f aegis-sol aegis-evm     # watch block/allow decisions
#
# The case scripts (demo/cases/*.sh) send transactions to :8899 / :8898.
services:
  aegis-sol:
    build: .
    environment:
      LISTEN_ADDR: "0.0.0.0:8899"
      DOWNSTREAM_URL: "http://host.docker.internal:8900"
      BLOCKLIST_PATH: "/app/policy/blocklist.txt"
      WASM_PLUGIN_PATH: "/app/policy/rule.wasm"
      LOG_FORMAT: "pretty"
    ports:
      - "8899:8899"
    volumes:
      - ./demo/.run:/app/policy:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8899; printf 'GET /metrics HTTP/1.0\\r\\n\\r\\n' >&3; grep -q aegis_blocklist_size <&3"]
      interval: 5s
      timeout: 3s
      retries: 5

  aegis-evm:
    build: .
    environment:
      LISTEN_ADDR: "0.0.0.0:8898"
      DOWNSTREAM_URL: "http://host.docker.internal:8545"
      BLOCKLIST_PATH: "/app/policy/blocklist.txt"
      WASM_PLUGIN_PATH: "/app/policy/rule.wasm"
      LOG_FORMAT: "pretty"
    ports:
      - "8898:8898"
    volumes:
      - ./demo/.run:/app/policy:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8898; printf 'GET /metrics HTTP/1.0\\r\\n\\r\\n' >&3; grep -q aegis_blocklist_size <&3"]
      interval: 5s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.4.2
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=1h"
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - aegis-sol
      - aegis-evm

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "3001:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
