services:
  validator:
    image: solanalabs/solana:v1.18.26
    command: >
      solana-test-validator
      --rpc-port 8900
      --quiet
    ports:
      - "8900:8900"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8900/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  aegis:
    build: .
    environment:
      LISTEN_ADDR: "0.0.0.0:8899"
      DOWNSTREAM_URL: "http://validator:8900"
      BLOCKLIST_PATH: "/app/blocklist.txt"
    ports:
      - "8899:8899"
    volumes:
      - ./blocklist.txt:/app/blocklist.txt:ro
    depends_on:
      validator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8899/metrics"]
      interval: 5s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.4.2
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=1h"
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - aegis

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
